fallback:
  model_key: gemma3_4b
  model_id: google/gemma-3-4b-it
  replaces: phi4_mm
  revision: null
  license: gemma
  allowed_reason: technical_eligibility_gate_only
  rule: May replace phi4_mm ONLY if Phi-4 fails a technical eligibility gate that
    cannot be repaired without changing the frozen protocol (cannot represent the
    common prompt, irreproducible image processing, or unresolved runtime incompatibility).
    NEVER for low effect size, high refusal, or an unexpected result.
  on_invoke:
  - preserve the complete failed Phi-4 preflight
  - write a machine-readable failure report
  - state the eligibility criterion that failed
  - replace BEFORE inspecting any full-panel causal result
  - pin the gemma3_4b exact revision
